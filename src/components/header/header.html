
<header class="fixed inset-x-0 top-0 z-50 w-full border-b border-gray-100 bg-white/95 shadow-sm backdrop-blur-xl">
  <nav class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-[72px] items-center justify-between gap-4">

      <a routerLink="/home" (click)="closeMenu()" class="group flex shrink-0 items-center gap-2.5">
        <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-600 to-violet-500 text-white shadow-lg shadow-indigo-500/25 transition duration-300 group-hover:rotate-[-6deg] group-hover:scale-105">
          <span class="material-icons text-2xl">shopping_bag</span>
        </div>
        <div class="flex flex-col">
          <span class="text-lg font-extrabold tracking-tight text-gray-900 sm:text-xl">
            E<span class="text-indigo-600">commerce</span>
          </span>
          <span class="hidden text-[10px] font-medium tracking-[0.18em] text-gray-400 sm:block">
            SHOP SMARTER
          </span>
        </div>
      </a>

      <div class="hidden items-center gap-7 lg:flex xl:gap-9">
        <a routerLink="/home" routerLinkActive="text-indigo-600" [routerLinkActiveOptions]="{exact: true}" class="text-sm font-semibold text-gray-500 transition hover:text-indigo-600">Home</a>
        <a routerLink="/store" routerLinkActive="text-indigo-600" class="text-sm font-semibold text-gray-500 transition hover:text-indigo-600">Store</a>
        <a routerLink="/about" routerLinkActive="text-indigo-600" class="text-sm font-semibold text-gray-500 transition hover:text-indigo-600">About Us</a>
        <a routerLink="/support" routerLinkActive="text-indigo-600" class="text-sm font-semibold text-gray-500 transition hover:text-indigo-600">Support</a>
        <a routerLink="/contact" routerLinkActive="text-indigo-600" class="text-sm font-semibold text-gray-500 transition hover:text-indigo-600">Contact</a>
      </div>

      <div class="hidden items-center gap-5 lg:flex">
        <a routerLink="/my/cart" class="group relative flex h-11 items-center gap-2 rounded-xl px-3 text-gray-600 transition hover:bg-indigo-50 hover:text-indigo-600">
          <span class="material-icons text-[23px]">shopping_cart</span>
          <span class="text-sm font-semibold">Cart</span>
          <span class="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-bold text-white">{{ NumberOfItemsInCart()}}</span>
        </a>
        <a routerLink="/login" class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-bold text-white shadow-md shadow-indigo-600/20 transition hover:-translate-y-0.5 hover:bg-indigo-700 hover:shadow-lg">
          Sign In
        </a>
      </div>

      <div class="flex items-center gap-2 lg:hidden">
        <a routerLink="/my/cart" aria-label="Shopping cart" class="relative flex h-10 w-10 items-center justify-center rounded-xl text-gray-700 transition hover:bg-indigo-50 hover:text-indigo-600">
          <span class="material-icons text-[23px]">shopping_cart</span>
          <span class="absolute right-0 top-0 flex h-[17px] min-w-[17px] items-center justify-center rounded-full bg-red-500 px-1 text-[9px] font-bold text-white">{{ NumberOfItemsInCart() }}</span>
        </a>

        <button
          type="button"
          (click)="toggleMenu()"
          [attr.aria-expanded]="isMenuOpen"
          aria-label="Toggle navigation menu"
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-gray-200 text-gray-700 transition hover:border-indigo-200 hover:bg-indigo-50 hover:text-indigo-600">
          <span class="material-icons text-2xl">
            {{ isMenuOpen ? 'close' : 'menu' }}
          </span>
        </button>
      </div>
    </div>

    @if (isMenuOpen) {
      <div class="border-t border-gray-100 py-4 lg:hidden">
        <div class="grid grid-cols-2 gap-2 sm:grid-cols-3">
          <a routerLink="/home" routerLinkActive="bg-indigo-50 text-indigo-600" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()" class="rounded-xl px-4 py-3 text-sm font-semibold text-gray-600 transition hover:bg-indigo-50 hover:text-indigo-600">Home</a>
          <a routerLink="/store" routerLinkActive="bg-indigo-50 text-indigo-600" (click)="closeMenu()" class="rounded-xl px-4 py-3 text-sm font-semibold text-gray-600 transition hover:bg-indigo-50 hover:text-indigo-600">Store</a>
          <a routerLink="/about" routerLinkActive="bg-indigo-50 text-indigo-600" (click)="closeMenu()" class="rounded-xl px-4 py-3 text-sm font-semibold text-gray-600 transition hover:bg-indigo-50 hover:text-indigo-600">About Us</a>
          <a routerLink="/support" routerLinkActive="bg-indigo-50 text-indigo-600" (click)="closeMenu()" class="rounded-xl px-4 py-3 text-sm font-semibold text-gray-600 transition hover:bg-indigo-50 hover:text-indigo-600">Support</a>
          <a routerLink="/contact" routerLinkActive="bg-indigo-50 text-indigo-600" (click)="closeMenu()" class="rounded-xl px-4 py-3 text-sm font-semibold text-gray-600 transition hover:bg-indigo-50 hover:text-indigo-600">Contact</a>
        </div>

        <a routerLink="/login" (click)="closeMenu()" class="mt-3 flex w-full items-center justify-center rounded-xl bg-indigo-600 px-4 py-3 text-sm font-bold text-white transition hover:bg-indigo-700">
          Sign In
        </a>
      </div>
    }
  </nav>
</header>
