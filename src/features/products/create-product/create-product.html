
<div class="min-h-screen bg-gray-50 px-4 py-8 sm:px-6 lg:px-8">
  <div class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-base font-medium text-gray-900 placeholder:text-gray-400 placeholder:font-normal outline-none transition focus:border-blue-600 focus:ring-4 focus:ring-blue-100">

    <div class="border-b border-gray-100 bg-gradient-to-r from-blue-600 to-indigo-600 px-6 py-6 sm:px-8">
      <div class="flex items-center gap-3">
        <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-white/20 text-white">
          <span class="material-icons">inventory_2</span>
        </div>
        <div>
          <h2 class="text-xl font-bold text-white sm:text-2xl">Create Product</h2>
          <p class="mt-1 text-sm text-blue-100">Add a new product to your store</p>
        </div>
      </div>
    </div>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-6 p-5 sm:p-8">

      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">

        <!-- Product Name -->
        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700">Product Name</label>
          <input type="text" formControlName="name"
                 placeholder="Enter product name"
                 class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100" />
          <p *ngIf="productForm.get('name')?.touched && productForm.get('name')?.invalid"
             class="mt-2 text-xs text-red-500">
            Product name is required.
          </p>
        </div>

        <!-- Brand -->
        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700">Brand</label>
          <input type="text" formControlName="brand"
                 placeholder="Enter brand"
                 class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100" />
        </div>

        <!-- Price -->
        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700">Price (DH)</label>
          <input type="number" formControlName="price"
                 placeholder="0.00" min="0"
                 class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100" />
          <p *ngIf="productForm.get('price')?.touched && productForm.get('price')?.invalid"
             class="mt-2 text-xs text-red-500">
            Enter a valid price.
          </p>
        </div>

        <!-- Quantity -->
        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700">Quantity</label>
          <input type="number" formControlName="quantity"
                 placeholder="0" min="0"
                 class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100" />
          <p *ngIf="productForm.get('quantity')?.touched && productForm.get('quantity')?.invalid"
             class="mt-2 text-xs text-red-500">
            Enter a valid quantity.
          </p>
        </div>

        <!-- Category -->
        <div class="sm:col-span-2">
          <label class="mb-2 block text-sm font-semibold text-gray-700">Category</label>
          <input type="text" formControlName="category"
                 placeholder="Enter category name (e.g. Phones)"
                 class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100" />
          <p *ngIf="productForm.get('category')?.touched && productForm.get('category')?.invalid"
             class="mt-2 text-xs text-red-500">
            Category is required.
          </p>
        </div>

        <!-- Description -->
        <div class="sm:col-span-2">
          <label class="mb-2 block text-sm font-semibold text-gray-700">Description</label>
          <textarea formControlName="description" rows="5"
                    placeholder="Write a detailed product description..."
                    class="w-full resize-y rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100"></textarea>
        </div>

        <!-- Active -->
        <div class="sm:col-span-2">
          <label class="flex cursor-pointer items-center justify-between rounded-xl border border-gray-200 bg-gray-50 p-4 transition hover:border-blue-200 hover:bg-blue-50/50">
            <div>
              <p class="text-sm font-semibold text-gray-700">Product Status</p>
              <p class="text-xs text-gray-500">Make this product visible in your store</p>
            </div>
            <input type="checkbox" formControlName="active"
                   class="h-5 w-5 cursor-pointer accent-blue-600" />
          </label>
        </div>

      </div>

      <!-- Actions -->
      <div class="flex flex-col-reverse gap-3 border-t border-gray-100 pt-6 sm:flex-row sm:justify-end">
        <button type="button" (click)="productForm.reset()"
                class="w-full rounded-xl border border-gray-200 px-6 py-3 text-sm font-semibold text-gray-600 transition hover:bg-gray-100 sm:w-auto">
          Reset
        </button>

        <button type="submit" [disabled]="productForm.invalid"
                class="flex w-full items-center justify-center gap-2 rounded-xl bg-blue-600 px-8 py-3 text-sm font-semibold text-white shadow-lg shadow-blue-600/20 transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto">
          <span class="material-icons text-lg">add_circle</span>
          Create Product
        </button>
      </div>

    </form>
  </div>
</div>
