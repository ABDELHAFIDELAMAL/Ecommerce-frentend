<div class="grid grid-cols-1 gap-6 bg-white p-4 sm:grid-cols-2 lg:grid-cols-3">

  @for (product of products(); track product.id) {

    <div class="w-full overflow-hidden rounded-xl border border-gray-200 bg-white">
      <div class="relative flex h-72 items-center justify-center bg-white">
        @if (product.images?.length) {
          <img
            [src]="'http://localhost:8090' + selectedImages()[product.id] || product.images[0].imageUrl"
            [alt]="product.name"
            class="h-full w-full object-contain"
          />
        } @else {
          <div class="text-sm text-gray-400">
            No image available
          </div>
        }

      </div>
      @if (product.images?.length) {

        <div class="flex gap-2 overflow-x-auto px-3 py-3">

          @for (image of product.images; track image.id) {

            <button
              type="button"
              (click)="selectImage(product.id, image.imageUrl)"
              class="h-16 w-16 shrink-0 overflow-hidden rounded-md border-2 bg-white"
              [class.border-red-500]="
                (selectedImages()[product.id] ||
                  product.images[0]?.imageUrl) === image.imageUrl
              "
              [class.border-gray-200]="
                (selectedImages()[product.id] ||
                  product.images[0]?.imageUrl) !== image.imageUrl
              "
            >

              <img
                [src]="'http://localhost:8090' + image.imageUrl"
                [alt]="image.altText || product.name"
                class="h-full w-full object-contain"
              />

            </button>

          }

        </div>

      }

      <!-- Informations produit -->
      <div class="border-t border-gray-100 p-4">

        <h2 class="line-clamp-2 text-base font-semibold text-gray-900">
          {{ product.name }}
        </h2>

        <p class="mt-2 text-xl font-bold text-red-600">
          {{ product.price }} DH
        </p>

        <p class="mt-2 line-clamp-3 text-sm text-gray-500">
          {{ product.description }}
        </p>

        <!-- Bouton -->
        <button
          type="button"
          class="mt-4 w-full rounded-lg bg-black px-4 py-3 font-medium text-white transition hover:bg-gray-800"
        >
          View product
        </button>

      </div>

    </div>

  }

</div>
