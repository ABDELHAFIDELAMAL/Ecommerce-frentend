<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-100 via-indigo-100 to-purple-100 p-4">
  <form
    [formGroup]="uploadImageForm"
    (ngSubmit)="submit()"
    class="w-full max-w-md sm:max-w-lg bg-white rounded-2xl shadow-xl p-6 sm:p-8 space-y-5"
  >
    <div class="text-center">
      <h2 class="text-2xl font-bold text-gray-800">Upload an image</h2>
      <p class="text-sm text-gray-500 mt-1">PNG, JPG or WEBP</p>
    </div>

    <div>
      <label for="altText" class="block text-sm font-medium text-gray-700 mb-1">Alt text</label>
      <input
        id="altText"
        type="text"
        formControlName="altText"
        placeholder="Describe the image"
        class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-800 placeholder-gray-400
               focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
      />
    </div>

    <!-- Zone de dépôt du fichier -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Image</label>
      <label
        for="file"
        class="flex flex-col items-center justify-center gap-2 w-full h-36 cursor-pointer rounded-xl
               border-2 border-dashed border-indigo-300 bg-indigo-50 text-indigo-600
               hover:bg-indigo-100 hover:border-indigo-500 transition"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
        </svg>
        <span class="text-sm font-medium">Click to choose a file</span>
        <input id="file" type="file" accept="image/*" (change)="onFileSelected($event)" class="hidden" />
      </label>
    </div>
    <div *ngIf="previewUrl" class="flex justify-center">
      <img
        [src]="previewUrl"
        alt="Preview"
        class="w-32 h-32 sm:w-40 sm:h-40 object-cover rounded-xl shadow-md ring-2 ring-indigo-200"
      />
    </div>

    <button
      type="submit"
      class="w-full rounded-lg bg-indigo-600 py-3 font-semibold text-white shadow-md
             hover:bg-indigo-700 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2
             disabled:opacity-50 disabled:cursor-not-allowed transition"
    >
      Upload
    </button>
  </form>
</div>
