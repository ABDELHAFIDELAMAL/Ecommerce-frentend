<div class="min-h-screen bg-gray-50 p-6">

  <div class="max-w-3xl mx-auto">

    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-800">
        Create Promotion
      </h1>
      <p class="text-gray-500 mt-2">
        Add a new discount promotion to your store.
      </p>
    </div>

    <form
      [formGroup]="promotionForm"
      (ngSubmit)="onSubmit()"
      class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 space-y-6">

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Promotion Name
        </label>

        <input
          type="text"
          formControlName="name"
          placeholder="Example: Black Friday"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">

        <p *ngIf="promotionForm.get('name')?.touched && promotionForm.get('name')?.invalid"
           class="text-red-500 text-sm mt-1">
          Promotion name is required.
        </p>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Description
        </label>

        <textarea
          formControlName="description"
          rows="4"
          placeholder="Describe your promotion..."
          class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <!-- Discount Type & Value -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Discount Type
          </label>

          <select
            formControlName="discountType"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-white outline-none focus:ring-2 focus:ring-blue-500">

            <option *ngFor="let type of discountTypes" [value]="type">
              {{ type }}
            </option>

          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Discount Value
          </label>

          <div class="relative">
            <input
              type="number"
              formControlName="discountValue"
              min="0.01"
              [max]="promotionForm.get('discountType')?.value === 'PERCENTAGE' ? 100 : null"
              placeholder="20"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">

            <span class="absolute right-4 top-3 text-gray-500">
              {{ promotionForm.get('discountType')?.value === 'PERCENTAGE' ? '%' : 'DH' }}
            </span>
          </div>

          <p *ngIf="discountValue?.touched && discountValue?.invalid"
             class="text-red-500 text-sm mt-1">
            Enter a valid discount value.
          </p>
        </div>

      </div>

      <!-- Start Date & End Date -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            Start Date
          </label>

          <input
            type="datetime-local"
            formControlName="startDate"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            End Date
          </label>

          <input
            type="datetime-local"
            formControlName="endDate"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        </div>

      </div>

      <!-- Active -->
      <div class="flex items-center justify-between bg-gray-50 p-4 rounded-lg">
        <div>
          <p class="font-semibold text-gray-700">Promotion Status</p>
          <p class="text-sm text-gray-500">Activate this promotion</p>
        </div>

        <input
          type="checkbox"
          formControlName="active"
          class="w-5 h-5 accent-blue-600 cursor-pointer">
      </div>

      <!-- Messages -->
      <div *ngIf="successMessage"
           class="p-3 bg-green-50 text-green-700 rounded-lg">
        {{ successMessage }}
      </div>

      <div *ngIf="errorMessage"
           class="p-3 bg-red-50 text-red-600 rounded-lg">
        {{ errorMessage }}
      </div>

      <!-- Submit -->
      <div class="flex justify-end gap-3 pt-4 border-t">

        <button
          type="button"
          (click)="promotionForm.reset()"
          class="px-6 py-3 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100">
          Reset
        </button>

        <button
          type="submit"
          [disabled]="loading"
          class="px-6 py-3 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 disabled:opacity-50">

          {{ loading ? 'Creating...' : 'Create Promotion' }}

        </button>

      </div>

    </form>

  </div>

</div>
